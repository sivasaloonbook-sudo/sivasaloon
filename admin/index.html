<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Siva Saloon — Admin Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<div class="page-shell">
  <div class="stripe-divider"></div>

  <div class="auth-shell">
    <div class="auth-card">
      <div class="brand">
        <img src="../assets/logo.png" alt="Siva Saloon logo" />
        <div class="brand-name">Siva Saloon<span>Admin Login</span></div>
      </div>

      <div class="panel">
        <form id="admin-login-form">
          <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required />
          </div>
          <button type="submit" class="btn btn-primary btn-block">Log In</button>
        </form>
      </div>

      <p class="mt-24" style="font-size: 0.85rem;">
        Customer? <a href="../customer/index.html">Book a slot instead</a>
      </p>
    </div>
  </div>

  <footer class="site-footer">Siva Saloon · Serapanancheri</footer>
</div>

<script>
  document.getElementById("admin-login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    try {
      const res = await fetch("/api/admin-login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Invalid credentials.");
      window.location.href = "dashboard.html";
    } catch (err) {
      alert(err.message);
    }
  });
</script>

</body>
</html>

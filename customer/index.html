<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Siva Saloon — Customer Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<div class="page-shell">
  <div class="stripe-divider"></div>

  <div class="auth-shell">
    <div class="auth-card">
      <div class="brand">
        <img src="../assets/logo.png" alt="Siva Saloon logo" />
        <div class="brand-name">Siva Saloon<span>Customer Login</span></div>
      </div>

      <div class="panel">
        <!-- Step 1: mobile number -->
        <form id="mobile-form">
          <div class="field">
            <label for="mobile">Mobile Number</label>
            <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile number" maxlength="10" required />
            <div class="hint">We'll send a one-time code via SMS (MSG91).</div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Send OTP</button>
        </form>

        <!-- Step 2: OTP entry (hidden until mobile is submitted) -->
        <form id="otp-form" style="display: none;">
          <div class="field">
            <label for="otp">Enter OTP</label>
            <input type="text" id="otp" name="otp" placeholder="6-digit code" maxlength="6" required />
            <div class="hint">Sent to <span id="otp-mobile-display"></span> · <a href="#" id="resend-otp">Resend code</a></div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Verify &amp; Continue</button>
        </form>
      </div>

      <p class="mt-24" style="font-size: 0.85rem;">
        Salon staff? <a href="../admin/index.html">Admin login</a>
      </p>
    </div>
  </div>

  <footer class="site-footer">Siva Saloon · Vanduvancheri</footer>
</div>

<script>
  // ------------------------------------------------------------
  // OTP flow wiring — MSG91 call happens server-side (Vercel
  // serverless function) so the auth key never reaches the browser.
  // This client just posts to those endpoints.
  // ------------------------------------------------------------
  const mobileForm = document.getElementById("mobile-form");
  const otpForm = document.getElementById("otp-form");
  const otpMobileDisplay = document.getElementById("otp-mobile-display");
  let pendingMobile = "";

  function setBusy(form, busy) {
    form.querySelector("button[type=submit]").disabled = busy;
  }

  mobileForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const mobile = document.getElementById("mobile").value.trim();
    if (!/^\d{10}$/.test(mobile)) {
      alert("Enter a valid 10-digit mobile number.");
      return;
    }
    pendingMobile = mobile;
    setBusy(mobileForm, true);

    try {
      const res = await fetch("/api/send-otp", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mobile }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Could not send OTP.");

      otpMobileDisplay.textContent = mobile;
      mobileForm.style.display = "none";
      otpForm.style.display = "block";
    } catch (err) {
      alert(err.message);
    } finally {
      setBusy(mobileForm, false);
    }
  });

  otpForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const otp = document.getElementById("otp").value.trim();
    setBusy(otpForm, true);

    try {
      const res = await fetch("/api/verify-otp", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mobile: pendingMobile, otp }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Invalid OTP.");

      window.location.href = "dashboard.html";
    } catch (err) {
      alert(err.message);
    } finally {
      setBusy(otpForm, false);
    }
  });

  document.getElementById("resend-otp").addEventListener("click", async (e) => {
    e.preventDefault();
    try {
      const res = await fetch("/api/send-otp", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mobile: pendingMobile }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Could not resend OTP.");
      alert("OTP resent to " + pendingMobile);
    } catch (err) {
      alert(err.message);
    }
  });
</script>

</body>
</html>

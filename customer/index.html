<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Siva Saloon — Customer Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<div class="page-shell">
  <div class="stripe-divider"></div>

  <div class="auth-shell">
    <div class="auth-card">
      <div class="brand">
        <img src="../assets/logo.png" alt="Siva Saloon logo" />
        <div class="brand-name">Siva Saloon<span>Customer Login</span></div>
      </div>

      <div class="panel">
        <p style="margin-bottom: 22px;">Sign in with your Google account to book a slot.</p>

        <!-- Google's own button renders here -->
        <div id="g_id_onload"
             data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
             data-callback="handleGoogleLogin"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin"
             data-type="standard"
             data-shape="rectangular"
             data-theme="filled_black"
             data-text="signin_with"
             data-size="large"
             data-width="320"
             style="display: flex; justify-content: center;">
        </div>

        <p id="login-error" style="color: var(--rust); margin-top: 16px; display: none;"></p>
      </div>

      <p class="mt-24" style="font-size: 0.85rem;">
        Salon staff? <a href="../admin/index.html">Admin login</a>
      </p>
    </div>
  </div>

  <footer class="site-footer">Siva Saloon · Vanduvancheri</footer>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
  async function handleGoogleLogin(response) {
    const errorEl = document.getElementById("login-error");
    errorEl.style.display = "none";

    try {
      const res = await fetch("/api/google-login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ credential: response.credential }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Sign-in failed.");

      window.location.href = "dashboard.html";
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.style.display = "block";
    }
  }
</script>

</body>
</html>
